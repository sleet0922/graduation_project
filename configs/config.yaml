server:
  port: ":8081"
  mode: "release"

database:
  username: "sleet"
  # Inject ZAT_DATABASE_PASSWORD at runtime. The OpenRC services read it from
  # the Bocker-provided environment file.
  password: "SET_ZAT_DATABASE_PASSWORD_IN_ENVIRONMENT"
  host: "127.0.0.1"
  port: 5432
  dbname: "graduation_project"
  charset: "utf8mb4"
  auto_migrate: false

oss:
  access_key_id: "SET_ZAT_OSS_ACCESS_KEY_ID_IN_ENVIRONMENT"
  secret_access_key: "SET_ZAT_OSS_SECRET_ACCESS_KEY_IN_ENVIRONMENT"
  bucket: "sleet"
  endpoint: "https://s3-cn-east-1.qiniucs.com"
  base_path: ""
  cdn_domain: "http://cdn.gelsomino.cn"

jwt:
  secret_key: "SET_ZAT_JWT_SECRET_IN_ENVIRONMENT"
  access_token_expire_seconds: 86400
  refresh_token_expire_seconds: 2592000

livekit:
  url: "SET_ZAT_LIVEKIT_URL_IN_ENVIRONMENT"
  api_key: "SET_ZAT_LIVEKIT_API_KEY_IN_ENVIRONMENT"
  api_secret: "SET_ZAT_LIVEKIT_API_SECRET_IN_ENVIRONMENT"
  token_expire_seconds: 7200

log:
  level: "info"
  filename: "logs/app.log"
  max_size: 100
  max_backups: 3
  max_age: 28
  compress: true

redis:
  addr: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
