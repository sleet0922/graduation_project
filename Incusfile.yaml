version: 1

args:
  GO_VERSION: "1.26.6"
  LIVEKIT_VERSION: "1.13.5"
  LIVEKIT_SHA256: "50633b65316b0b8c854fb4bee4ae4040839fcf5c149bccb9ae2097fb7526991c"
  LIVEKIT_GOPROXY: "https://goproxy.cn"
  LIVEKIT_GOPROXY_SHA256: "56f15714ce38a4a299de1242cf324c2a5e0d0b19115d23c3a26da946934b6fd3"

mirror: china
name: graduation-project
network: nat

stages:
  - name: builder
    from: debian/13
    steps:
      - mise:
          tool: go
          version: "${GO_VERSION}"
      - pkg: [unzip, wget]
      - workdir: /src/graduation-project
      - copy:
          sources: [go.mod, go.sum]
          destination: /src/graduation-project/
      - copy:
          sources: [cmd]
          destination: /src/graduation-project/cmd/
      - copy:
          sources: [internal]
          destination: /src/graduation-project/internal/
      - copy:
          sources: [pkg]
          destination: /src/graduation-project/pkg/
      - env:
          CGO_ENABLED: "0"
      - exec:
          command: go
          args: [mod, download]
      - exec:
          command: go
          args: [build, -trimpath, "-ldflags=-s -w", -o, /out/graduation-project, ./cmd/api]
      - download:
          output: /tmp/livekit-v${LIVEKIT_VERSION}.archive
          extract: /src
          attempts:
            - url: https://github.com/livekit/livekit/archive/refs/tags/v${LIVEKIT_VERSION}.tar.gz
              sha256: "${LIVEKIT_SHA256}"
              format: tar.gz
              timeout: 20
              tries: 1
            - url: ${LIVEKIT_GOPROXY}/github.com/livekit/livekit/@v/v${LIVEKIT_VERSION}.zip
              sha256: "${LIVEKIT_GOPROXY_SHA256}"
              format: zip
              timeout: 30
              tries: 3
              move:
                from: /src/github.com/livekit/livekit@v${LIVEKIT_VERSION}
                to: /src/livekit-${LIVEKIT_VERSION}
          verify:
            path: /src/livekit-${LIVEKIT_VERSION}/version/version.go
            pattern: 's/^const Version = "\([^" ]*\)"/\1/p'
            value: "${LIVEKIT_VERSION}"
      - workdir: /src/livekit-${LIVEKIT_VERSION}
      - exec:
          command: mkdir
          args: [-p, /out]
      - exec:
          command: go
          args: [build, -p, "2", -trimpath, "-ldflags=-s -w", -o, /out/livekit-server, ./cmd/server]
      - exec:
          command: chmod
          args: ["0755", /out/livekit-server]

  - from: debian/13
    steps:
      - pkg: [ca-certificates, openssl, postgresql, redis-server, caddy]
      - workdir: /opt/graduation-project
      - copy:
          from: builder
          sources: [/out/graduation-project, /out/livekit-server]
          destination: /usr/local/bin/
      - copy:
          sources: [configs/config.yaml]
          destination: /opt/graduation-project/configs/
      - copy:
          sources: [configs/systemd]
          destination: /etc/systemd/system/
      - copy:
          sources: [configs/livekit.yaml]
          destination: /etc/livekit/
      - copy:
          sources: [configs/Caddyfile]
          destination: /etc/caddy/
      - copy:
          sources: [ssl]
          destination: /etc/caddy/certs/
      - exec:
          command: mkdir
          args: [-p, /var/lib/livekit, /var/log/graduation-project, /opt/graduation-project/logs, /etc/graduation-project]
      - exec:
          command: chmod
          args: ["0755", /var/lib/livekit, /var/log/graduation-project, /opt/graduation-project/logs, /etc/graduation-project]
      - exec:
          command: chmod
          args: ["0755", /usr/local/bin/graduation-project, /usr/local/bin/livekit-server]
      - exec:
          command: chown
          args: [root:caddy, /etc/caddy/certs/1.pem, /etc/caddy/certs/1.key]
      - exec:
          command: chmod
          args: ["0644", /etc/caddy/certs/1.pem]
      - exec:
          command: chmod
          args: ["0640", /etc/caddy/certs/1.key]
      - exec:
          command: openssl
          args: [rand, -hex, "24"]
          capture: DB_PASSWORD
      - service:
          start: [postgresql.service]
      - exec:
          command: runuser
          args: [-u, postgres, --, psql, -v, ON_ERROR_STOP=1, -d, postgres, -c, "CREATE ROLE sleet LOGIN PASSWORD '${DB_PASSWORD}'"]
      - exec:
          command: runuser
          args: [-u, postgres, --, createdb, -O, sleet, graduation_project]
      - write:
          path: /etc/graduation-project/runtime.env
          mode: "0600"
          content: |
            ZAT_DATABASE_PASSWORD=${DB_PASSWORD}
            ZAT_DATABASE_AUTO_MIGRATE=true
      - service:
          stop: [postgresql.service]
          enable: [postgresql.service, redis-server.service, graduation-project.service, livekit.service, caddy.service]
    runtime:
      expose:
        - port: 81
          protocol: tcp
        - port: 444
          protocol: tcp
        - port: 444
          protocol: udp
        - port: 7881
          protocol: tcp
        - port: 7882
          protocol: udp
      autostart: true
